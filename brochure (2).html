<style>
  :root{
    --navy:#0c3d2a; --navy-2:#082a1d; --navy-3:#13543a; --navy-4:#0a4d33;
    --amber:#feb23c; --amber-2:#f4900c; --green:#179048; --cream:#f6f1e5;
    --ink:#12281d; --muted:#55665c; --line:#dfe6d9; --gold:#e9c77b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#c9cfc4}
  body{font-family:'Inter',sans-serif;color:var(--ink)}

  .page{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;margin:0 auto;box-shadow:0 2px 24px rgba(0,0,0,.25)}
  .page + .page{margin-top:12mm}

  @page{size:A4 portrait;margin:0}
  @media print{
    html,body{background:#fff}
    .page{box-shadow:none;margin:0;page-break-after:always}
    .page:last-child{page-break-after:auto}
  }

  /* ==================== PAGE 1 — COVER ==================== */
  .p1{display:flex;flex-direction:column;background:linear-gradient(165deg,var(--navy) 0%,var(--navy-2) 100%)}

  .p1-head{display:flex;align-items:center;gap:14px;padding:11mm 14mm 0;flex:none}
  .p1-logo{height:16mm;width:auto;background:#fff;border-radius:3mm;padding:2.2mm;box-shadow:0 4px 14px rgba(0,0,0,.35);object-fit:contain}
  .p1-brand{line-height:1.15}
  .p1-brand b{font-family:'Fraunces',serif;font-size:18pt;color:#fff;letter-spacing:.01em;display:block}
  .p1-brand span{font-size:7.5pt;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-weight:600}

  .p1-hero{position:relative;flex:1;min-height:0;margin:9mm 14mm 0;border-radius:8px;overflow:hidden}
  .p1-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.06)}
  .p1-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,42,29,.92) 0%,rgba(8,42,29,.45) 40%,rgba(8,42,29,.08) 68%)}
  .p1-hero .hi{position:absolute;left:0;right:0;bottom:0;padding:9mm 11mm;z-index:1}
  .p1-hero .kicker{display:inline-flex;align-items:center;gap:6px;background:rgba(254,178,60,.15);border:1px solid rgba(254,178,60,.5);color:#ffd87a;font-size:7.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:2mm 4mm;border-radius:999px;margin-bottom:4.5mm}
  .p1-hero h1{font-family:'Fraunces',serif;font-size:27pt;line-height:1.14;color:#fff;font-weight:800;max-width:150mm}
  .p1-hero h1 .hl{color:var(--amber)}
  .p1-hero .lead{margin-top:4mm;color:#e4eddd;font-size:9.5pt;line-height:1.55;max-width:152mm}

  .p1-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7mm;padding:9mm 14mm 0;flex:none}
  .stat{background:rgba(255,255,255,.055);border:1px solid rgba(233,199,123,.28);border-radius:8px;padding:5mm 3mm;text-align:center}
  .stat b{font-family:'Fraunces',serif;font-size:16.5pt;font-weight:800;color:var(--amber);display:block;line-height:1.05}
  .stat span{color:var(--gold);font-size:6.8pt;letter-spacing:.14em;text-transform:uppercase;font-weight:700;display:block;margin-top:1.6mm}
  .stat small{color:#bfd2c0;font-size:6.8pt;line-height:1.35;display:block;margin-top:.8mm}

  .p1-band{margin:9mm 14mm 12mm;background:linear-gradient(120deg,#ffc45e,var(--amber-2));border-radius:9px;padding:6mm 8mm;display:flex;align-items:center;justify-content:space-between;gap:8mm;flex:none}
  .p1-band .b-left{min-width:0}
  .p1-band b{font-family:'Fraunces',serif;font-size:13pt;color:var(--navy-2);display:block;line-height:1.2}
  .p1-band p{font-size:8.2pt;color:rgba(8,42,29,.82);font-weight:500;margin-top:1.4mm;line-height:1.45}
  .p1-band .go{flex:none;background:var(--navy-2);color:var(--amber);font-weight:800;font-size:10pt;padding:4.5mm 8mm;border-radius:999px;white-space:nowrap;letter-spacing:.04em}

  /* ==================== PAGE 2 — DETAILS ==================== */
  .p2{display:flex;flex-direction:column;background:#fff}
  .p2-top{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-3) 70%,var(--navy-2) 100%);padding:9mm 16mm;flex:none;position:relative}
  .p2-top::before{content:"";position:absolute;width:64mm;height:64mm;border-radius:50%;background:radial-gradient(circle,rgba(254,178,60,.18),transparent 65%);top:-26mm;right:-16mm}
  .p2-top .kicker{color:var(--gold);font-size:7pt;font-weight:700;letter-spacing:.24em;text-transform:uppercase;margin-bottom:2.4mm}
  .p2-top h2{font-family:'Fraunces',serif;font-size:18pt;color:#fff;font-weight:700;line-height:1.15}
  .p2-top p{color:#cfe0cf;font-size:8pt;margin-top:2.2mm;max-width:158mm;line-height:1.5}

  .p2-body{flex:1;min-height:0;padding:7mm 16mm;display:grid;grid-template-columns:1.15fr 1fr;gap:9mm}

  .sec{margin-bottom:5mm}
  .sec-title{display:flex;align-items:center;gap:7px;margin-bottom:3mm}
  .sec-title .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
  .sec-title h3{font-family:'Fraunces',serif;font-size:12pt;color:var(--navy);font-weight:700;letter-spacing:.01em}

  .svc{display:flex;gap:8px;padding:2.7mm 0;border-bottom:1px solid var(--line)}
  .svc:last-child{border-bottom:none}
  .svc .ic{width:8mm;height:8mm;flex:none;border-radius:7px;background:linear-gradient(135deg,var(--green),var(--navy-3));color:#fff;display:flex;align-items:center;justify-content:center}
  .svc .ic svg{width:14px;height:14px}
  .svc h4{font-size:9.3pt;color:var(--navy);font-weight:700;margin-bottom:.6mm}
  .svc p{font-size:7.2pt;color:var(--muted);line-height:1.45}

  .why{list-style:none}
  .why li{display:flex;gap:7px;padding:2mm 0;border-bottom:1px solid var(--line);font-size:7.9pt;line-height:1.4;color:var(--ink)}
  .why li:last-child{border-bottom:none}
  .why .ck{color:var(--green);font-weight:800;flex:none}
  .why b{color:var(--navy)}

  .proc{list-style:none}
  .proc li{display:flex;gap:7px;align-items:baseline;padding:1.35mm 0;font-size:7.4pt;color:var(--muted);line-height:1.4}
  .proc li .n{flex:none;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--navy-3);color:var(--amber);font-weight:800;font-size:7pt;display:inline-flex;align-items:center;justify-content:center;transform:translateY(1px)}
  .proc b{color:var(--ink);font-weight:600}

  .cmp-sec{margin-bottom:0}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:1mm}
  .cmp .side{background:#f3f7f1;border:1px solid var(--line);border-radius:8px;padding:3.2mm 4mm}
  .cmp .side.hl{background:linear-gradient(140deg,var(--navy-3),var(--navy-2));border-color:rgba(233,199,123,.45)}
  .cmp .side .cname{font-family:'Fraunces',serif;font-weight:700;font-size:9.5pt;color:var(--navy)}
  .cmp .side.hl .cname{color:var(--amber)}
  .cmp .side .csub{font-size:6.6pt;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:1.4mm}
  .cmp .side.hl .csub{color:var(--gold)}
  .cmp .side ul{list-style:none}
  .cmp .side li{display:flex;gap:5px;font-size:6.9pt;color:#3d5a48;line-height:1.35;padding:.9mm 0}
  .cmp .side li::before{content:"";flex:none;width:4px;height:4px;border-radius:50%;background:var(--green);margin-top:2px}
  .cmp .side.hl li{color:#d7e6d3}
  .cmp .side.hl li::before{background:var(--amber)}

  .p2-right{display:flex;flex-direction:column;min-height:0}
  .stat-card{background:var(--navy-2);border-radius:9px;padding:4mm 5mm;margin-bottom:5mm;border:1px solid rgba(233,199,123,.28);flex:none}
  .stat-card .srow{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:1.6mm 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:7.7pt;color:#d7e6d3}
  .stat-card .srow:last-child{border-bottom:none}
  .stat-card .srow b{color:var(--amber);font-family:'Fraunces',serif;font-size:9.5pt;text-align:right}
  .stat-card .scap{color:var(--gold);font-size:6.6pt;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:2mm}

  .next{background:#fff8ec;border:1px solid #f3d9a8;border-radius:9px;padding:4mm 5mm;margin-bottom:5mm;flex:none}
  .next .n-title{color:var(--amber-2);font-family:'Fraunces',serif;font-size:10pt;font-weight:700;margin-bottom:1.6mm}
  .next ol{list-style:none}
  .next li{display:flex;gap:7px;font-size:7.5pt;color:var(--ink);padding:1.4mm 0;line-height:1.4}
  .next li .n{flex:none;width:4.4mm;height:4.4mm;border-radius:50%;background:var(--amber);color:var(--navy-2);font-weight:800;font-size:6.8pt;display:inline-flex;align-items:center;justify-content:center;transform:translateY(1px)}

  .contact{background:linear-gradient(140deg,var(--navy-3),var(--navy-2));border-radius:9px;padding:3.8mm 5.5mm;color:#eaf2e2;flex:1;display:flex;flex-direction:column;border:1px solid rgba(233,199,123,.25)}
  .contact .c-title{color:var(--amber);font-family:'Fraunces',serif;font-size:11pt;font-weight:700;margin-bottom:1.8mm}
  .contact .c{font-size:7.7pt;line-height:1.4;margin-bottom:1mm}

    brand: "Vana <span>Aishwarya</span> Green Enterprises",
    note:  "Solar EPC · Energy-as-a-Service · Indigenous-owned &amp; women-led<br>Figures indicative — actual savings depend on site, tariff and policy.",
  },
};

/* ====================================================================
   RENDER — no need to edit below this line.
   ==================================================================== */
(function(){
  var C = BROCHURE, P2 = C.page2;

  // escape helper: only used where we intentionally allow a few tags
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function tx(id, s){ var el=document.getElementById(id); if(el) el.textContent=s; }
  function html(id, s){ var el=document.getElementById(id); if(el) el.innerHTML=s; }
  function setAttr(id, att, v){ var el=document.getElementById(id); if(el) el.setAttribute(att, v); }

  // ---- brand ----
  tx('bName', C.brand.name);
  tx('bTag', C.brand.tagline);

  // ---- cover ----
  tx('bBadge', C.cover.badge);
  html('bHeadline', esc(C.cover.headline).replace(/\n/g,'<br>').replace(/(20–40%|₹0|70–90%|25 yr)/g,'<span class="hl">$1</span>'));
  tx('bLead', C.cover.lead);

  html('bStats', C.cover.stats.map(function(s){
    return '<div class="stat"><b>'+esc(s.value)+'</b><span>'+esc(s.label)+'</span><small>'+esc(s.note||'')+'</small></div>';
  }).join(''));

  tx('bBandHead', C.turnOver.heading);
  tx('bBandText', C.turnOver.text);
  tx('bBandBtn',  C.turnOver.button);

  // ---- page 2 ----
  tx('bKicker', P2.kicker);
  tx('bP2Head', P2.heading);
  tx('bP2Intro', P2.intro);
  tx('bSvcTitle', P2.servicesTitle);
  tx('bProcTitle', P2.processTitle);
  tx('bWhyTitle', P2.whyTitle);
  tx('bCompareTitle', P2.compareTitle);
  tx('bGlanceCap', P2.glanceCap);
  tx('bNextTitle', P2.nextTitle);
  tx('bContactTitle', P2.contactTitle);
  tx('bContactCta', P2.contactCta);

  var ICONS = {
    home:     '<path d="M3 12l2.5-2.5M5.5 9.5L8 7m8 10l2.5-2.5M13 4.5L15 6.5m1 11l2 2M4 20h16M12 4v4m0 0a2 2 0 012 2v8M12 8a2 2 0 00-2 2v8h4v-8a2 2 0 00-2-2z"/>',
    industry: '<path d="M3 21h18M5 21V7l6 4V7l8 5v9M5 14h3M16 12h3"/>',
    utility:  '<path d="M12 3v4m0 0l2.5-2.5M12 7L9.5 4.5M4 12h4m0 0L5.5 9.5M8 12l2.5 2.5M20 12h-4m0 0l2.5-2.5M16 12l-2.5 2.5M12 17v4"/><path d="M5 20c2-4 5-6 7-6s5 2 7 6"/>',
    sun:      '<path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.5 5.8 21l1.6-7L2 9.3l7.1-.7z"/>',
  };

  html('bServices', P2.services.map(function(s){
    var ic = ICONS[s.icon] || ICONS.sun;
    return '<div class="svc"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+ic+'</svg></div>'
         + '<div><h4>'+esc(s.title)+'</h4><p>'+esc(s.desc)+'</p></div></div>';
  }).join(''));

  html('bProcess', P2.process.map(function(p){
    return '<li><span class="n"></span><span>'+esc(p)+'</span></li>';
  }).join(''));

  html('bCompare', (P2.compare||[]).map(function(c){
    return '<div class="side'+(c.hl?' hl':'')+'"><div class="cname">'+esc(c.name)+'</div><div class="csub">'+esc(c.sub||'')+'</div><ul>'
      + c.points.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('') + '</ul></div>';
  }).join(''));

  html('bWhy', P2.why.map(function(w){
    return '<li><span class="ck">&#10003;</span><span>'+w+'</span></li>';
  }).join(''));

  html('bGlance', P2.glance.map(function(g){
    return '<div class="srow"><span>'+esc(g.label)+'</span><b>'+esc(g.value)+'</b></div>';
  }).join(''));

  html('bNext', P2.next.map(function(n){
    return '<li><span class="n"></span><span>'+esc(n)+'</span></li>';
  }).join(''));

  var rows = [];
  if (P2.contact.email) rows.push('<div class="c"><span>Email</span><br><a href="mailto:'+esc(P2.contact.email)+'">'+esc(P2.contact.email)+'</a></div>');
  if (P2.contact.phone) rows.push('<div class="c"><span>Call / WhatsApp</span><br><a href="tel:'+esc(P2.contact.phoneHref||P2.contact.phone)+'">'+esc(P2.contact.phone)+'</a></div>');
  if (P2.contact.web)   rows.push('<div class="c"><span>Web</span><br>'+esc(P2.contact.web)+'</div>');
  if (P2.contact.base)  rows.push('<div class="c"><span>Base</span><br>'+esc(P2.contact.base)+'</div>');
  if (P2.contact.hours) rows.push('<div class="c"><span>Hours</span><br>'+esc(P2.contact.hours)+'</div>');
  html('bContactRows', rows.join(''));

  html('bFootBrand', C.footer.brand);
  html('bFootNote', C.footer.note);
})();
</script>
</body>
